<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            line-height: 1.4;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0050b3;
        }
        button:active {
            background: #003a8c;
        }
        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
            display: block;
        }
        .status.error {
            background: #fff1f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
            display: block;
        }
        .presets {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .preset-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .preset-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .preset-btn {
            flex: 1;
            min-width: 60px;
            padding: 6px 10px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            background: #e6e6e6;
            border-color: #bbb;
        }
        .expand-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .expand-btn {
            width: 100%;
            padding: 8px;
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .expand-btn:hover {
            background: #e8e8e8;
            border-color: #bbb;
        }
        .expand-btn .arrow {
            display: inline-block;
            transition: transform 0.2s;
        }
        .expand-btn.expanded .arrow {
            transform: rotate(180deg);
        }
        .collapsible-section {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .collapsible-section.visible {
            display: block;
        }
        .custom-times-save-btn {
            width: 100%;
            padding: 8px;
            background: #52c41a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .custom-times-save-btn:hover {
            background: #389e0d;
        }
        .custom-times-save-btn:active {
            background: #255618;
        }
    </style>

</head>
<body>
    <div class="container">
        <h1 data-i18n="title">⏱️ 时间偏移设置</h1>
        
        <!-- Offset Section -->
        <div class="form-group">
            <label for="offsetInput" data-i18n="label">时间偏移 (小时):</label>
            <input type="number" id="offsetInput" placeholder="输入小时数，例如 2" step="0.5" data-i18n="placeholder">
            <div class="hint" data-i18n="hint">
                正数表示快进，负数表示延后<br>
                • 1 表示快进 1 小时<br>
                • -1 表示延后 1 小时
            </div>
        </div>

        <button id="saveBtn" data-i18n="saveBtn">💾 保存设置</button>
        <div id="status" class="status"></div>

        <!-- Preset Buttons -->
        <div class="presets">
            <div class="preset-label" data-i18n="presetLabel">快速预设:</div>
            <div class="preset-buttons">
                <button class="preset-btn" data-hours="0" data-i18n="preset0">无偏移</button>
                <button class="preset-btn" data-hours="1" data-i18n="preset1">+1小时</button>
                <button class="preset-btn" data-hours="-5" data-i18n="preset2">-5小时</button>
                <button class="preset-btn" data-hours="-9" data-i18n="preset3">-9小时</button>
            </div>
        </div>

        <!-- Expandable Section for Custom Times -->
        <div class="expand-section">
            <button id="expandBtn" class="expand-btn">
                <span data-i18n="expandLabel">自定义日出/日落时间</span>
                <span class="arrow">▼</span>
            </button>

            <div id="collapsibleSection" class="collapsible-section">
                <div class="form-group">
                    <label for="sunriseInput" data-i18n="sunriseLabel">日出时间 (HH:MM, 可选):</label>
                    <input type="time" id="sunriseInput" data-i18n="sunriseHint">
                    <div class="hint" data-i18n="sunriseHintText">留空则使用自动检测的时间</div>
                </div>

                <div class="form-group">
                    <label for="sunsetInput" data-i18n="sunsetLabel">日落时间 (HH:MM, 可选):</label>
                    <input type="time" id="sunsetInput" data-i18n="sunsetHint">
                    <div class="hint" data-i18n="sunsetHintText">留空则使用自动检测的时间</div>
                </div>

                <button id="customTimesSaveBtn" class="custom-times-save-btn" data-i18n="customSaveBtn">💾 保存自定义时间</button>
                <div id="customStatus" class="status"></div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
